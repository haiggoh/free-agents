# --- TIER 2 — Gemini: still VERIFIED for tool-calling, but DEMOTED from the default.
# The free quota is reached annoyingly fast, leaving little headroom to get real work
# done in one sitting (operator, 2026-09-15) — a lane you cannot finish a task on is not
# the right Enter-default however good its tool-calling is. Kept high because when it has
# quota it is the best-behaved of the free lanes.
# ★ 3.8 FIRST, preferred over 3.6 for as long as it stays available (operator, 2026-09-15).
# If 3.8 is withdrawn or starts erroring, 3.6 below is the fallback and is still VERIFIED.
  - alias: gemini-3.8-flash
    provider: gemini
    model_id: gemini-3.8-flash
    display: Google Gemini 3.8 Flash
    tier: renewing_free
    notes: >-
      ★ PREFERRED Gemini. Catalog-listed; newer than 3.6. Thinking off for latency.
    autocompact_default: "-"

  - alias: gemini-3.8-flash-thinking
    provider: gemini
    model_id: gemini-3.8-flash
    display: Google Gemini 3.8 Flash (thinking)
    tier: renewing_free
    notes: "Preferred Gemini, thinking ON — slower, stronger reasoning."
    autocompact_default: "-"

  - alias: gemini-flash
    provider: gemini
    model_id: gemini-3.6-flash
    display: Google Gemini 3.6 Flash
    tier: renewing_free
    notes: >-
      FALLBACK. VERIFIED chat+tools over multiple sessions; use when 3.8 is unavailable.
    autocompact_default: "-"

  - alias: gemini-flash-thinking
    provider: gemini
    model_id: gemini-3.6-flash
    display: Google Gemini 3.6 Flash (thinking)
    tier: renewing_free
    notes: "VERIFIED weights; thinking ON — slower, stronger reasoning."
    autocompact_default: "-"

  - alias: gemini-flash-lite
    provider: gemini
