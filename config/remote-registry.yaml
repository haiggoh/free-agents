# Remote provider registry — single source of truth for provider endpoints
# and the model roster. Both bin/remote-provider-registry.py (Python) and
# bin/remote-provider-registry.sh (bash) parse this file.
#
# Schema: see docs/remote-sot-execution-plan.md
# Route fields (read by bin/remote-registry-generate.py):
#   litellm_prefix       LiteLLM provider prefix of the proxy model string (<prefix>/<model>)
#   api_base_mode        none = LiteLLM knows the endpoint; static = pass base_url as api_base;
#                        cloudflare = account-scoped base resolved at run time (_cloudflare_base)
#   generic_openai_base  true = _openai_base answers for this provider (remote-session.sh relies on it)
#   catalog_mode         default = base_url + models_path; cloudflare_search = /models/search?per_page=100
#   catalog_disabled_message  set = no catalog route; the message is printed instead
#   session_env          env names remote-keys.sh exports (default: key_env + extra_env)
#   retired_message      set = provider refused by _available with this message
# Env names cleared from the Claude child besides every provider's session_env:
clear_env_extra:
  - OPENAI_API_KEY

