# Model roster — one row per (alias, provider, model_id) triple.
# The hierarchy (provider accordion → models underneath) is computed
# at render time; this is a flat list of edges in the provider↔model graph.
entries:

# remote-agents.sh — the REMOTE cloud-API session roster.
#
# Deliberately a SEPARATE list from the local MLX aliases in config.local.sh:
# a remote agent runs on someone else's hardware over the network, so it is
# selected on its own menu and never mixed into the local model list.
#
# Each entry:  alias|provider|model-id|display|tier|notes|autocompact_default
# provider must have a key mapping and a remote-session.sh proxy route.
# tier: renewing_free | trial | unknown | paid_only
# autocompact_default: default LA_AUTO_COMPACT_WINDOW for this model (e.g., 1m for 1M-context models),
#                      or "-" for no default, or empty. Only used when LA_AUTO_COMPACT_WINDOW is not set.
# SELECT requires an explicit --remote-model ID or an interactive model choice.
#
# Recheck pinned ids with remote-session.sh --verify <alias> (catalog GET only).
# Launch does not consume a separate generation probe. A catalog listing is not
# evidence of working tool calls, remaining quota, or an account billing limit.
# Catalogs checked 2026-09-14. Newly added rows are CATALOG ONLY: no generation
# probes were spent. Historical tool checks are identified individually below.
# ════════════════════════════════════════════════════════════════════════════════
# ★ TIER 1 — NVIDIA NIM: THE PREFERRED REMOTE LANE. Listed first, and first is the
# Enter-default in every picker that reads this roster in order.
#
# WHY IT LEADS, and why this is evidence and not enthusiasm: the rate limits are very
# generous and there is no known DAILY quota — the constraint other providers hit first
# and hardest. The operator has run several successful sessions here across different
# models (reported 2026-09-15).
#
# The one real downside was NIM reasoning models returning `reasoning_content`, which is
# not an Anthropic thinking block — the translation layer died with "Content block is not
# a thinking block" and took the session's endpoint with it. FIXED: write_proxy_config now
# sends chat_template_kwargs.enable_thinking=false for nvidia unless thinking is asked for.
# That fix is a PREREQUISITE of this promotion; without it the default lane breaks sessions.
#
# ⚠️ Tier stays `unknown` deliberately — NVIDIA publishes no per-account quota, so
# `renewing_free` would be a promise the provider does not make.
# Leading the roster is about PREFERENCE ORDER, not about a billing guarantee.
# ★ MEASURED 2026-09-19 (operator): there is no known DAILY quota at all, and the one
# real ceiling is ~40 requests per MINUTE. So `unknown` is the honest ENUM value but an
# understatement as a LABEL — _tier_label() in bin/remote-session.sh renders these rows
# as "no daily cap/40/min" for the user while this field stays a valid enum member.
# Because the limit is per-MINUTE, bursty/parallel probing is what trips it: a 429 here
# is evidence about OUR request rate, never about the model.
# ⚠️ NVIDIA's catalog reports tools:"unknown" for EVERY row, so tool capability cannot be
# read from the catalog — a new row here is catalog-only until a real tool session proves it.
# ════════════════════════════════════════════════════════════════════════════════
# Ordered by USER PREFERENCE first, then GENERATION EVIDENCE: confirmed lanes first,
# partially-working next, never-produced-a-token last (each row states its evidence).
# 2026-10-15 user preference for the session picker: GLM 5.3 Flash (thinking) leads, then
# GLM 5.3 (thinking), Ultra (thinking), Super (thinking), Lightning (thinking), Laguna,
# then the non-thinking variants mirrored (Lightning after Super); the remaining visible
# models and the hidden broken rows follow.
# Re-probe with: bin/remote-probe-log.py probe --all-nvidia ; report
  - alias: nvidia-glm53-thinking
    provider: nvidia
    model_id: z-ai/glm-5.3-flash
    display: Z.ai GLM 5.3 Flash (thinking)
    tier: unknown
    notes: >-
      PARTIAL: same model as the base alias — thinking is always-on on NIM; this alias just defaults reasoning_effort high. Fast.
    autocompact_default: "-"

  - alias: nvidia-glm53-full-thinking
    provider: nvidia
    model_id: z-ai/glm-5.3
    display: Z.ai GLM 5.3 (thinking)
    tier: unknown
    notes: >-
      SLOW LANE: deliberate deep-work mode — ~1min door charge + reasoning at reasoning_effort high. Excellent quality, minutes per turn. Streaming required.
    autocompact_default: "-"

  - alias: nvidia-nemotron-ultra-thinking
    provider: nvidia
    model_id: nvidia/nemotron-3-ultra-550b-a55b
    display: NVIDIA Nemotron 3 Ultra 550B-A55B (thinking)
    tier: unknown
    notes: >-
      Reasoning enabled — stronger reasoning, uses reasoning_content. Verified 2026-10-02.
    autocompact_default: 1m

  - alias: nvidia-nemotron3-thinking
    provider: nvidia
    model_id: nvidia/nemotron-3-super-120b-a12b
    display: NVIDIA Nemotron 3 Super 120B-A12B (thinking)
    tier: unknown
    notes: >-
      Reasoning enabled — stronger reasoning, uses reasoning_content. Verified 2026-10-02.
    autocompact_default: "-"

  - alias: nvidia-lightning-thinking
    provider: nvidia
    model_id: nvidia/nemotron-3.5-lightning-30b-a3b
    display: NVIDIA Nemotron 3.5 Lightning 30B-A3B (thinking)
    tier: unknown
    notes: Reasoning enabled — stronger reasoning. Verified 2026-10-02.
    autocompact_default: "-"

  - alias: nvidia-glm53
    provider: nvidia
    model_id: z-ai/glm-5.3-flash
    display: Z.ai GLM 5.3 Flash
    tier: unknown
    notes: >-
      PARTIAL: fast (1-4s), always-thinking — thinking CANNOT be disabled on NIM (chat_template_kwargs inert, measured 2026-10-13; reasoning_effort is the only dial). Non-streaming fine for small outputs. Earlier 'empty' verdicts were the probe max_tokens artifact.
    autocompact_default: "-"

  - alias: nvidia-glm53-full
    provider: nvidia
    model_id: z-ai/glm-5.3
    display: Z.ai GLM 5.3
    tier: unknown
    notes: >-
      SLOW LANE: ~1min NVIDIA-side door charge before first token (payload-independent, measured 2026-10-13) + reasoning volume. Thinking always-on; reasoning_effort is the only dial (base alias defaults low). Streaming required in practice.
    autocompact_default: "-"

  - alias: nvidia-nemotron-ultra
    provider: nvidia
    model_id: nvidia/nemotron-3-ultra-550b-a55b
    display: NVIDIA Nemotron 3 Ultra 550B-A55B
    tier: unknown
    notes: >-
      ★ PREFERRED DEFAULT (user preference, 2026-09-19). GENERATION-CONFIRMED 2/2 probes (2026-09-15). Largest NIM model; reasoning disabled by default.
    autocompact_default: 1m

  - alias: nvidia-nemotron3
    provider: nvidia
    model_id: nvidia/nemotron-3-super-120b-a12b
    display: NVIDIA Nemotron 3 Super 120B-A12B
    tier: unknown
    notes: >-
      GENERATION-CONFIRMED 2/2 probes + a live session (2026-09-15). Reasoning disabled by default.
    autocompact_default: "-"

  - alias: nvidia-lightning
    provider: nvidia
    model_id: nvidia/nemotron-3.5-lightning-30b-a3b
    display: NVIDIA Nemotron 3.5 Lightning 30B-A3B
    tier: unknown
    notes: >-
      GENERATION-CONFIRMED 2/2 probes (2026-09-15). Small/fast MoE — best utility pick. Reasoning disabled by default.
    autocompact_default: "-"

  - alias: nvidia-laguna
    provider: nvidia
    model_id: poolside/laguna-xs-2.1
    display: Poolside Laguna XS 2.1
    tier: unknown
    notes: >-
      PARTIAL: Generation OK 1/2 probes (1x 503 worker-limit) 2026-09-15. Code-oriented; capacity-constrained (worker limit 32). 33B params / 3B active / 256K context (poolside.ai, 2026-10-15) — sits below the non-thinking models by size; auto-compact window 200k.
    autocompact_default: 200k

  - alias: nvidia-muse-glimmer
    provider: nvidia
    model_id: meta/muse-glimmer-30b
    display: Meta Muse Glimmer 30B
    tier: unknown
    notes: >-
      RESTORED 2026-10-13: earlier 'empty' verdicts were the probe max_tokens=24 artifact; fixed probe (512 budget) answers OK. Occasional HTTP 500 historically (1/5).
    autocompact_default: "-"

  - alias: nvidia-gemma4
    provider: nvidia
    model_id: google/gemma-4-31b-it
    display: Google Gemma 4 31B IT
    tier: unknown
    notes: >-
      RESTORED 2026-10-13: the 2026-10-11 timeouts were transient capacity; fixed probe answers OK.
    autocompact_default: "-"

  - alias: nvidia-kimi-k3
    provider: nvidia
    model_id: moonshotai/kimi-k3
    display: Moonshot Kimi K3
    tier: unknown
    notes: >-
      ⚠️ RETIRED: NVIDIA returns 410 Gone since 2026-10-15 (end of life). Earlier probes timed out (2026-10-10/13). Hidden via broken-nvidia-models.json.
    autocompact_default: "-"

  - alias: nvidia-deepseek-v4
    provider: nvidia
    model_id: deepseek-ai/deepseek-v4.1-flash
    display: DeepSeek V4.1 Flash
    tier: unknown
    notes: >-
      WORKS, SLOW (2026-10-21): a 4-file review dispatch answered in ~10 min with a substantive result; earlier probes (2026-10-10/13) timed out at 90-180 s. Dispatch with a long timeout; too slow for a full session. Old v4-flash-0731 is 410 Gone.
    autocompact_default: "-"

  - alias: nvidia-gptoss
